<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Mandji</title><link rel="stylesheet" href="styles.css"><style>body{background:#101810;color:#eee}main{max-width:850px;margin:auto;padding:30px}label{display:grid;gap:6px;margin:12px 0}input,textarea,select,button{font:inherit;padding:10px}section{border:1px solid #a88e56;padding:22px;margin:24px 0}audio{width:100%}</style><main><a href="/">Volver al juego</a><h1>Configuración de Mandji</h1><p id="status" role="status">Cargando…</p><section><h2>Música por capítulo</h2><label>Capítulo<select id="chapter"></select></label><p id="track"></p><audio id="preview" controls></audio><label>Pista de audio · máximo 20 MB<input id="file" type="file" accept="audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/webm"></label><button id="upload" disabled>SUBIR Y ASIGNAR</button><p>Utiliza pistas propias o con permiso de uso. El capítulo 1 usa un ambiente instrumental suave si no has asignado una pista.</p></section><section><h2>Añadir acertijo</h2><p>Se añadirán al banco original de 50.</p><form id="riddle"><label>Pregunta<textarea name="question" required maxlength="2000"></textarea></label><label>Respuesta A<input name="a" required maxlength="500"></label><label>Respuesta B<input name="b" required maxlength="500"></label><label>Respuesta C<input name="c" required maxlength="500"></label><label>Respuesta correcta<select name="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></label><label>Ayuda<input name="hint" required maxlength="1000"></label><button id="add" disabled>AÑADIR ACERTIJO</button></form><h3>Acertijos añadidos</h3><div id="list"></div></section></main><script src="admin.js"></script></html>
